[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orcad-placement-agent"
version = "0.2.0"
description = "Human-approved local placement access for Cadence PCB Editor"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
knowledge = ["pypdf>=6,<7", "fonttools>=4.60,<5"]
integrations = ["mcp>=2.2,<3"]

[project.scripts]
orcad-placement-agent = "orcad_placement_agent.cli:main"
orcad-placement-mcp = "orcad_placement_agent.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.cmdclass]
build_py = "orcad_placement_agent._build.BuildWithRuntimeAssets"
