[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orcad-placement-agent"
version = "0.5.0"
description = "Human-approved local placement access for Cadence PCB Editor"
readme = "README.md"
authors = [{name = "oo_yang"}]
requires-python = ">=3.12"
dependencies = []

[project.urls]
Repository = "https://github.com/ooyang0325/OrCad-PCB-Review-Agent"
Documentation = "https://github.com/ooyang0325/OrCad-PCB-Review-Agent/blob/main/docs/installation.md"

[project.optional-dependencies]
knowledge = ["pypdf>=6,<7", "fonttools>=4.60,<5"]
integrations = ["mcp>=2.2,<3"]

[project.scripts]
orcad-placement-agent = "orcad_placement_agent.cli:main"
orcad-placement-mcp = "orcad_placement_agent.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orcad_placement_agent = ["_knowledge/*.json"]

[tool.setuptools.cmdclass]
build_py = "orcad_placement_agent._build.BuildWithRuntimeAssets"
