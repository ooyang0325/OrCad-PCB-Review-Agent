[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orcad-placement-agent"
version = "0.1.0"
description = "Human-approved local placement access for Cadence PCB Editor"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
knowledge = ["pypdf>=6,<7", "fonttools>=4.60,<5"]

[project.scripts]
orcad-placement-agent = "orcad_placement_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
